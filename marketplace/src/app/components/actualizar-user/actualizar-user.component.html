<div class="container mt-4">
  <div class="d-flex justify-content-start mb-3">
    <button class="btn btn-outline-secondary" [routerLink]="['/opciones/', id]">
      Volver a Opciones
    </button>
  </div>
  <!-- Validación -->
  <div class="card shadow-sm mb-4">
    <div class="card-body">
      <h3 class="mb-3">Verificación de identidad</h3>
      <p class="text-muted">Confirma tus credenciales para modificar tu información</p>
      <fieldset [disabled]="formularioActualizacion">
        <label class="form-label">Username</label>
        <input class="form-control mb-3" name="username" [(ngModel)]="userA.username">
        <label class="form-label">Password</label>
        <input type="password" class="form-control mb-3" name="password" [(ngModel)]="userA.password">

        <button class="btn btn-primary" (click)="validacion()">Verificar</button>
      </fieldset>
    </div>
  </div>
  <!-- FORMULARIO BLOQUEADO/DESBLOQUEADO -->
  <div class="card shadow-sm" [class.opacity-50]="!formularioActualizacion">

    <div class="card-body">
      <h3>Actualizar datos</h3>

      <fieldset [disabled]="!formularioActualizacion">
        <label class="form-label">Nuevo username
        </label>
        <input class="form-control mb-2" [(ngModel)]="userU.usuario">

        <label class="form-label">Nuevo nickname</label>

        <input class="form-control mb-2" [(ngModel)]="userU.nickname">

        <label class="form-label">Nueva contraseña</label>

        <input type="password" class="form-control mb-3" [(ngModel)]="userU.password">

        <div class="mb-3">
          <label class="form-label">Ubicacion</label>
          <div class="text-end">
          <button type="button" class="btn btn-outline-primary"
               (click)="modificarUbicacion()" ><!--[disabled]="!ubicacionBloqueada"-->
            {{ botonUbicacion }}
          </button></div>
          <div class="input-group">
          <select class="form-select" [(ngModel)]="userU.ubicacion"
                  name="ubicacion" [disabled]="ubicacionBloqueada">

            <option value="">Seleccione su ubicación</option>
            <option value="Culiacan, Sinaloa">Culiacan, Sinaloa</option>
            <option value="Mazatlan, Sinaloa">Mazatlan, Sinaloa</option>
            <option value="Guamuchil, Sinaloa">Guamuchil, Sinaloa</option>
            <option value="Guasave, Sinaloa">Guasave, Sinaloa</option>
            <option value="Los Mochis, Sinaloa">Los Mochis, Sinaloa</option>
            <option value="Angostura, Sinaloa">Angostura, Sinaloa</option>
            <option value="Pericos, Sinaloa">Pericos, Sinaloa</option>
          </select></div>
        </div>

        <button class="btn btn-success" (click)="actualizarUsuario()">Guardar cambios</button>
      </fieldset>
    </div>
  </div>
</div>
